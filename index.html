<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    臺北市體育運動教練職業工會｜課程簽到系統
  </title>

  <!-- LINE LIFF -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;

      box-shadow:
        0 2px 10px rgba(0,0,0,.06);
    }

    .system-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .system-subtitle {
      color: #777;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;

      box-shadow:
        0 2px 10px rgba(0,0,0,.06);
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      border-radius: 20px;

      padding: 32px 24px;

      text-align: center;

      box-shadow:
        0 4px 20px rgba(0,0,0,.08);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-description {
      color: #777;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .btn {
      width: 100%;

      border: 0;
      border-radius: 10px;

      padding: 13px 16px;

      margin-top: 8px;

      font-weight: 600;

      transition: .2s;
    }

    .btn:hover {
      opacity: .88;
    }

    .btn-primary {
      background: #06c755;
      color: #ffffff;
    }

    .btn-blue {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-dark {
      background: #333333;
      color: #ffffff;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #333333;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-warning {
      background: #f59e0b;
      color: #ffffff;
    }

    .btn-success {
      background: #16a34a;
      color: #ffffff;
    }

    .role-badge {
      display: inline-block;

      padding: 5px 12px;

      border-radius: 999px;

      font-size: 13px;

      background: #eef2ff;
      color: #3730a3;

      margin-bottom: 8px;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;

      margin-top: 18px;
    }

    .menu-button {
      border: 1px solid #e5e7eb;

      background: #ffffff;

      border-radius: 12px;

      padding: 18px 12px;

      text-align: center;

      font-weight: 600;

      color: #333;
    }

    .menu-button:hover {
      background: #f8fafc;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .course-card {
      border: 1px solid #e5e7eb;

      border-radius: 14px;

      padding: 18px;

      margin-bottom: 12px;

      background: #ffffff;
    }

    .course-name {
      font-size: 18px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .course-info {
      color: #666;
      font-size: 14px;

      line-height: 1.8;
    }

    .status {
      display: inline-block;

      padding: 4px 9px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 600;

      margin-top: 8px;
    }

    .status-open {
      background: #dcfce7;
      color: #166534;
    }

    .status-draft {
      background: #f3f4f6;
      color: #374151;
    }

    .status-closed {
      background: #fef3c7;
      color: #92400e;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;

      font-weight: 600;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;

      border: 1px solid #d1d5db;

      border-radius: 9px;

      padding: 11px 12px;

      outline: none;

      background: #ffffff;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: #2563eb;
    }

    .form-textarea {
      min-height: 100px;

      resize: vertical;
    }

    .button-row {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-top: 12px;
    }

    .button-row .btn {
      width: auto;

      flex: 1;
      min-width: 120px;
    }

    .table-wrapper {
      width: 100%;

      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;

      padding: 10px 8px;

      text-align: left;

      white-space: nowrap;
    }

    th {
      background: #f9fafb;

      font-weight: 700;
    }

    .empty {
      text-align: center;

      padding: 30px 15px;

      color: #888;
    }

    .loading {
      text-align: center;

      padding: 40px 20px;

      color: #777;
    }

    .message {
      border-radius: 10px;

      padding: 12px 14px;

      margin-bottom: 14px;

      line-height: 1.6;
    }

    .message-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message-success {
      background: #dcfce7;
      color: #166534;
    }

    .message-info {
      background: #eff6ff;
      color: #1e40af;
    }

    .modal {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.45);

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 9999;
    }

    .modal-card {
      background: #ffffff;

      border-radius: 18px;

      width: 100%;
      max-width: 600px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 24px;
    }

    .modal-title {
      font-size: 20px;

      font-weight: 700;

      margin-bottom: 18px;
    }

    .close-button {
      float: right;

      border: 0;

      background: transparent;

      font-size: 24px;

      cursor: pointer;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .card {
        padding: 17px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .button-row {
        flex-direction: column;
      }

      .button-row .btn {
        width: 100%;
      }

    }

  </style>
</head>

<body>

<!-- ==================================================
     LOGIN
     ================================================== -->

<div
  id="loginPage"
  class="login-page"
>

  <div class="login-card">

    <div class="login-title">
      臺北市體育運動教練職業工會
    </div>

    <div class="system-subtitle">
      課程簽到系統
    </div>

    <br>

    <div class="login-description">
      請使用 LINE 登入課程簽到系統
    </div>

    <button
      class="btn btn-primary"
      onclick="startLogin()"
    >
      使用 LINE 登入
    </button>

    <div
      id="loginMessage"
      style="margin-top:15px;"
    ></div>

  </div>

</div>


<!-- ==================================================
     MAIN
     ================================================== -->

<div
  id="mainPage"
  class="hidden"
>

  <div class="container">

    <!-- Header -->

    <div class="header">

      <div class="system-title">
        臺北市體育運動教練職業工會
      </div>

      <div class="system-subtitle">
        課程簽到系統
      </div>

    </div>


    <!-- User -->

    <div class="card">

      <div
        id="roleBadge"
        class="role-badge"
      >
        使用者
      </div>

      <div
        id="userName"
        class="user-name"
      >
        -
      </div>

      <div
        id="userInfo"
        style="
          color:#777;
          margin-top:6px;
        "
      >
      </div>

    </div>


    <!-- Message -->

    <div
      id="globalMessage"
      class="hidden"
    ></div>


    <!-- Menu -->

    <div
      id="menuCard"
      class="card"
    >

      <div class="section-title">
        功能選單
      </div>

      <div
        id="menuGrid"
        class="menu-grid"
      ></div>

    </div>


    <!-- Content -->

    <div
      id="contentArea"
      class="card"
    >

      <div class="empty">
        請選擇上方功能
      </div>

    </div>

  </div>

</div>


<!-- ==================================================
     MODAL
     ================================================== -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-card">

    <button
      class="close-button"
      onclick="closeModal()"
    >
      ×
    </button>

    <div
      id="modalContent"
    ></div>

  </div>

</div>


<script>

/* ==================================================
   系統設定
   ================================================== */

const LIFF_ID =
  '2011196867-72x76BlI';


let currentUser = null;

let currentRole = null;

let currentStudent = null;


/* ==================================================
   初始化
   ================================================== */

document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init() {

  showLogin();

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      return;

    }

    await loginWithLINE();

  } catch (error) {

    showLoginMessage(
      error.message,
      'error'
    );

  }

}


/* ==================================================
   LINE 登入
   ================================================== */

async function startLogin() {

  try {

    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }

    await loginWithLINE();

  } catch (error) {

    showLoginMessage(
      error.message,
      'error'
    );

  }

}


async function loginWithLINE() {

  try {

    showLoginMessage(
      '登入中……',
      'info'
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        '無法取得 LINE ID Token'
      );

    }


    const result =
      await api(
        'checkUser',
        {
          idToken: idToken
        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        'LINE 登入失敗'
      );

    }


    currentRole =
      String(
        result.role || ''
      ).toUpperCase();


    currentUser =
      result.user ||
      null;


    currentStudent =
      result.student ||
      null;


    /*
     * 尚未登入學員
     */

    if (
      result.registered === false
    ) {

      showStudentLoginPage();

      return;

    }


    showMainPage();

  } catch (error) {

    showLoginMessage(
      error.message,
      'error'
    );

  }

}


/* ==================================================
   顯示登入頁
   ================================================== */

function showLogin() {

  document
    .getElementById(
      'loginPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'mainPage'
    )
    .classList
    .add('hidden');

}


/* ==================================================
   顯示主頁
   ================================================== */

function showMainPage() {

  document
    .getElementById(
      'loginPage'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'mainPage'
    )
    .classList
    .remove('hidden');


  renderUserInfo();

  renderMenu();

}


/* ==================================================
   使用者資訊
   ================================================== */

function renderUserInfo() {

  const roleText =
    getRoleText(
      currentRole
    );


  document
    .getElementById(
      'roleBadge'
    )
    .textContent =
      roleText +
      ' / ' +
      currentRole;


  document
    .getElementById(
      'userName'
    )
    .textContent =
      currentUser?.Name ||
      currentStudent?.Name ||
      '使用者';


  document
    .getElementById(
      'userInfo'
    )
    .textContent =
      currentRole === 'STUDENT'
        ? '學員'
        : '系統使用者';

}


/* ==================================================
   角色文字
   ================================================== */

function getRoleText(role) {

  switch (role) {

    case 'ADMIN':
      return '管理者';

    case 'TEACHER':
      return '老師';

    case 'STUDENT':
      return '學員';

    default:
      return '使用者';

  }

}


/* ==================================================
   功能選單
   ================================================== */

function renderMenu() {

  const menu =
    document.getElementById(
      'menuGrid'
    );


  menu.innerHTML = '';


  if (
    currentRole === 'STUDENT'
  ) {

    addMenuButton(
      menu,
      '查看課程',
      loadCourses
    );


    addMenuButton(
      menu,
      '查看簽到紀錄',
      loadMyAttendance
    );


    addMenuButton(
      menu,
      '登出',
      logout
    );

    return;

  }


  if (
    currentRole === 'TEACHER'
  ) {

    addMenuButton(
      menu,
      '建立課程',
      openCreateCourse
    );


    addMenuButton(
      menu,
      '查看課程',
      loadCourses
    );


    addMenuButton(
      menu,
      '查看簽到紀錄',
      loadTeacherAttendance
    );


    addMenuButton(
      menu,
      '登出',
      logout
    );

    return;

  }


  if (
    currentRole === 'ADMIN'
  ) {

    addMenuButton(
      menu,
      '建立課程',
      openCreateCourse
    );


    addMenuButton(
      menu,
      '查看課程',
      loadCourses
    );


    addMenuButton(
      menu,
      '查看簽到紀錄',
      loadAllAttendance
    );


    addMenuButton(
      menu,
      '使用者管理',
      loadUsers
    );


    addMenuButton(
      menu,
      '系統紀錄',
      loadLogs
    );


    addMenuButton(
      menu,
      '登出',
      logout
    );

  }

}


function addMenuButton(
  container,
  text,
  callback
) {

  const button =
    document.createElement(
      'button'
    );


  button.className =
    'menu-button';


  button.textContent =
    text;


  button.onclick =
    callback;


  container.appendChild(
    button
  );

}


/* ==================================================
   學員登入
   ================================================== */

function showStudentLoginPage() {

  document
    .getElementById(
      'loginPage'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'mainPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'roleBadge'
    )
    .textContent =
      '學員登入';


  document
    .getElementById(
      'userName'
    )
    .textContent =
      '請輸入學員姓名';


  document
    .getElementById(
      'userInfo'
    )
    .textContent =
      '同名學員會再要求輸入手機號碼';


  document
    .getElementById(
      'menuCard'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'contentArea'
    )
    .innerHTML = `

      <div class="section-title">
        學員登入
      </div>

      <div
        id="studentLoginMessage"
      ></div>

      <div class="form-group">

        <label class="form-label">
          學員姓名
        </label>

        <input
          id="studentName"
          class="form-input"
          placeholder="請輸入姓名"
        >

      </div>

      <div
        id="phoneGroup"
        class="form-group hidden"
      >

        <label class="form-label">
          手機號碼
        </label>

        <input
          id="studentPhone"
          class="form-input"
          placeholder="請輸入手機號碼"
          inputmode="tel"
        >

      </div>

      <button
        class="btn btn-primary"
        onclick="studentLogin()"
      >
        登入
      </button>

    `;

}


async function studentLogin() {

  const name =
    document
      .getElementById(
        'studentName'
      )
      .value
      .trim();


  const phoneInput =
    document.getElementById(
      'studentPhone'
    );


  const phone =
    phoneInput
      ? phoneInput.value.trim()
      : '';


  if (!name) {

    showStudentLoginMessage(
      '請輸入學員姓名',
      'error'
    );

    return;

  }


  try {

    showStudentLoginMessage(
      '登入中……',
      'info'
    );


    const result =
      await api(
        'loginStudent',
        {

          idToken:
            liff.getIDToken(),

          Name:
            name,

          Phone:
            phone

        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        '登入失敗'
      );

    }


    /*
     * 同名 → 要求手機
     */

    if (
      result.needPhone
    ) {

      document
        .getElementById(
          'phoneGroup'
        )
        .classList
        .remove('hidden');


      showStudentLoginMessage(
        result.message ||
        '請輸入手機號碼',
        'info'
      );


      return;

    }


    currentRole =
      'STUDENT';


    currentStudent =
      result.student;


    currentUser =
      null;


    showMainPage();


  } catch (error) {

    showStudentLoginMessage(
      error.message,
      'error'
    );

  }

}


/* ==================================================
   課程列表
   ================================================== */

async function loadCourses() {

  showLoading(
    '課程載入中……'
  );


  try {

    const result =
      await api(
        'getCourses',
        {
          idToken:
            liff.getIDToken()
        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        '無法取得課程'
      );

    }


    const courses =
      result.courses || [];


    let html = `

      <div class="section-title">
        課程列表
      </div>

    `;


    if (
      courses.length === 0
    ) {

      html += `

        <div class="empty">
          目前沒有課程
        </div>

      `;

    }


    courses.forEach(
      course => {

        html +=
          renderCourseCard(
            course
          );

      }
    );


    setContent(
      html
    );

  } catch (error) {

    showError(
      error.message
    );

  }

}


/* ==================================================
   課程卡片
   ================================================== */

function renderCourseCard(
  course
) {

  const status =
    String(
      course.Status || ''
    ).toUpperCase();


  let buttons = '';


  /*
   * 學員
   */

  if (
    currentRole === 'STUDENT'
  ) {

    if (
      status === 'OPEN'
    ) {

      buttons += `

        <button
          class="btn btn-success"
          onclick="checkIn('${escapeAttr(course.CourseID)}')"
        >
          簽到
        </button>

      `;

    }

  }


  /*
   * 老師／管理員
   */

  if (
    currentRole === 'TEACHER' ||
    currentRole === 'ADMIN'
  ) {

    buttons += `

      <div class="button-row">

        <button
          class="btn btn-blue"
          onclick="openEditCourse('${escapeAttr(course.CourseID)}')"
        >
          編輯
        </button>

        ${
          status !== 'OPEN'
            ? `
              <button
                class="btn btn-success"
                onclick="changeCourseStatus('${escapeAttr(course.CourseID)}','openCourse')"
              >
                開放簽到
              </button>
            `
            : `
              <button
                class="btn btn-warning"
                onclick="changeCourseStatus('${escapeAttr(course.CourseID)}','closeCourse')"
              >
                關閉簽到
              </button>
            `
        }

        ${
          status !== 'CANCELLED'
            ? `
              <button
                class="btn btn-danger"
                onclick="changeCourseStatus('${escapeAttr(course.CourseID)}','cancelCourse')"
              >
                取消課程
              </button>
            `
            : ''
        }

      </div>

    `;

  }


  return `

    <div class="course-card">

      <div class="course-name">
        ${escapeHtml(
          course.CourseName || ''
        )}
      </div>

      <div class="course-info">

        日期：
        ${escapeHtml(
          course.CourseDate || ''
        )}

        <br>

        時間：
        ${escapeHtml(
          course.StartTime || ''
        )}
        -
        ${escapeHtml(
          course.EndTime || ''
        )}

        <br>

        老師：
        ${escapeHtml(
          course.TeacherName || ''
        )}

        <br>

        地點：
        ${escapeHtml(
          course.Location || ''
        )}

      </div>

      ${renderStatus(status)}

      ${
        buttons
          ? `<div style="margin-top:10px;">
               ${buttons}
             </div>`
          : ''
      }

    </div>

  `;

}


/* ==================================================
   課程狀態
   ================================================== */

function renderStatus(
  status
) {

  let text =
    status;


  let className =
    'status-draft';


  if (
    status === 'OPEN'
  ) {

    text =
      '開放簽到';

    className =
      'status-open';

  }


  if (
    status === 'DRAFT'
  ) {

    text =
      '尚未開放';

  }


  if (
    status === 'CLOSED'
  ) {

    text =
      '已關閉';

    className =
      'status-closed';

  }


  if (
    status === 'CANCELLED'
  ) {

    text =
      '已取消';

    className =
      'status-cancelled';

  }


  return `

    <span class="status ${className}">
      ${escapeHtml(text)}
    </span>

  `;

}

/* ==================================================
   API
   ================================================== */

async function api(
  action,
  data
) {

  const url =
    window.location.href;


  const payload =
    Object.assign(
      {},
      data || {},
      {
        action:
          action
      }
    );


  const response =
    await fetch(
      url,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'application/json'

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const result =
    await response.json();


  return result;

}

/* ==================================================
   工具
   ================================================== */

function valueOf(
  id
) {

  const element =
    document.getElementById(
      id
    );


  return element
    ? element.value.trim()
    : '';

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}
