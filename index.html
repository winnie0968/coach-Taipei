<div class="container">

<script>

  /* ==================================================
     基本設定
     ================================================== */

  const CONFIG = {

    LIFF_ID:
      '2011196867-72x76BlI',

    API_URL:
      'https://script.google.com/macros/s/AKfycbzoll0ZZHiHeqCs12p0O9aqdwfWmjgIYKprSRK729RChjuEMQHPF7EyU9TgxjMdGxyI/exec'

  };


  let currentUser = null;

  let currentRole = null;

  let currentIdToken = null;

  let currentCourseId = null;

  let currentCourse = null;


  /* ==================================================
     初始化
     ================================================== */

  async function init() {

    try {

      if (
        !CONFIG.LIFF_ID
      ) {

        throw new Error(
          '尚未設定 LIFF ID'
        );

      }

      if (
        !CONFIG.API_URL
      ) {

        throw new Error(
          '尚未設定 Apps Script Web App /exec 網址'
        );

      }


      await loadLiff();


      const urlParams =
        new URLSearchParams(
          window.location.search
        );


      currentCourseId =
        urlParams.get(
          'course'
        );


      if (
        !liff.isLoggedIn()
      ) {

        showLogin();

        return;

      }


      await loadUser();


    } catch (error) {

      showLoginError(
        '系統初始化失敗：' +
        error.message
      );

    }

  }


  /* ==================================================
     LIFF
     ================================================== */

  async function loadLiff() {

    await liff.init({
      liffId:
        CONFIG.LIFF_ID
    });

  }


  /* ==================================================
     LINE 登入
     ================================================== */

  function loginWithLine() {

    try {

      liff.login();

    } catch (error) {

      showLoginError(
        error.message
      );

    }

  }


  /* ==================================================
     顯示登入
     ================================================== */

  function showLogin() {

    hide(
      'loadingBox'
    );

    show(
      'loginBox'
    );

  }


  /* ==================================================
     載入使用者
     ================================================== */

  async function loadUser() {

    hide(
      'loadingBox'
    );

    try {

      currentIdToken =
        liff.getIDToken();


      if (
        !currentIdToken
      ) {

        throw new Error(
          '無法取得 LINE ID Token'
        );

      }


      const result =
        await api(
          'checkUser',
          {

            idToken:
              currentIdToken

          }
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          '無法取得使用者資料'
        );

      }


      if (
        !result.registered
      ) {

        showUnregisteredUser(
          result
        );

        return;

      }


      currentRole =
        String(
          result.role || ''
        ).toUpperCase();


      if (
        currentRole ===
        'STUDENT'
      ) {

        currentUser =
          result.student;

      }

      else {

        currentUser =
          result.user;

      }


      displayUser();


      showRolePanel();


      /*
       * 如果是從 QR Code 進來
       */

      if (
        currentCourseId
      ) {

        await loadQRCodeCourse();

      }

    } catch (error) {

      showLoginError(
        error.message
      );

    }

  }


  /* ==================================================
     顯示使用者
     ================================================== */

  function displayUser() {

    show(
      'userBox'
    );

    show(
      'logoutBox'
    );


    const name =
      currentUser &&
      currentUser.Name
        ? currentUser.Name
        : '使用者';


    document
      .getElementById(
        'userName'
      )
      .textContent =
      name;


    document
      .getElementById(
        'userRole'
      )
      .textContent =
      getRoleName(
        currentRole
      );


    if (
      currentUser &&
      currentUser.PictureURL
    ) {

      document
        .getElementById(
          'userAvatar'
        )
        .src =
        currentUser.PictureURL;

    }

    else {

      document
        .getElementById(
          'userAvatar'
        )
        .style.display =
        'none';

    }

  }


  /* ==================================================
     角色介面
     ================================================== */

  function showRolePanel() {

    hide(
      'studentPanel'
    );

    hide(
      'teacherPanel'
    );

    hide(
      'adminPanel'
    );


    if (
      currentRole ===
      'STUDENT'
    ) {

      show(
        'studentPanel'
      );

    }


    if (
      currentRole ===
      'TEACHER'
    ) {

      show(
        'teacherPanel'
      );

    }


    if (
      currentRole ===
      'ADMIN'
    ) {

      show(
        'adminPanel'
      );

    }

  }


  /* ==================================================
     QR Code 課程
     ================================================== */

  async function loadQRCodeCourse() {

    try {

      show(
        'qrCourseBox'
      );


      const result =
        await api(
          'getCourse',
          {

            CourseID:
              currentCourseId

          }
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          '找不到課程'
        );

      }


      currentCourse =
        result.course;


      renderQRCodeCourse();


    } catch (error) {

      document
        .getElementById(
          'qrCourseContent'
        )
        .innerHTML =
        `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;


      document
        .getElementById(
          'checkInButton'
        )
        .disabled =
        true;

    }

  }


  /* ==================================================
     顯示 QR 課程
     ================================================== */

  function renderQRCodeCourse() {

    const course =
      currentCourse;


    if (
      !course
    ) {

      return;

    }


    const status =
      String(
        course.Status || ''
      ).toUpperCase();


    document
      .getElementById(
        'qrCourseContent'
      )
      .innerHTML =
      `
        <div class="course">

          <div class="course-title">
            ${escapeHtml(
              course.CourseName || '未命名課程'
            )}
          </div>

          <div class="course-info">

            📅 日期：
            ${escapeHtml(
              course.CourseDate || ''
            )}

            <br>

            🕐 時間：
            ${escapeHtml(
              course.StartTime || ''
            )}
            -
            ${escapeHtml(
              course.EndTime || ''
            )}

            <br>

            👨‍🏫 老師：
            ${escapeHtml(
              course.TeacherName || ''
            )}

            <br>

            📍 地點：
            ${escapeHtml(
              course.Location || '未設定'
            )}

          </div>

          <div class="status ${getStatusClass(status)}">

            ${getStatusText(status)}

          </div>

        </div>
      `;


    const button =
      document.getElementById(
        'checkInButton'
      );


    if (
      currentRole !==
      'STUDENT'
    ) {

      button.disabled =
        true;

      button.textContent =
        '學員登入後才能簽到';

      return;

    }


    if (
      status !==
      'OPEN'
    ) {

      button.disabled =
        true;

      button.textContent =
        '目前未開放簽到';

    }

  }


  /* ==================================================
     QR 課程簽到
     ================================================== */

  async function checkInCurrentCourse() {

    if (
      !currentCourseId
    ) {

      return;

    }


    if (
      currentRole !==
      'STUDENT'
    ) {

      showResult(
        'checkInResult',
        '只有學員可以簽到',
        'error'
      );

      return;

    }


    const button =
      document.getElementById(
        'checkInButton'
      );


    button.disabled =
      true;


    button.textContent =
      '簽到處理中……';


    try {

      const result =
        await api(
          'checkIn',
          {

            idToken:
              currentIdToken,

            CourseID:
              currentCourseId

          }
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          '簽到失敗'
        );

      }


      if (
        result.alreadyCheckedIn
      ) {

        showResult(
          'checkInResult',
          '您已完成簽到。',
          'success'
        );


        button.textContent =
          '✅ 已完成簽到';

        return;

      }


      showResult(
        'checkInResult',
        '🎉 簽到成功！',
        'success'
      );


      button.textContent =
        '✅ 簽到成功';


    } catch (error) {

      showResult(
        'checkInResult',
        error.message,
        'error'
      );


      button.disabled =
        false;

      button.textContent =
        '🟢 立即簽到';

    }

  }


  /* ==================================================
     查看課程
     ================================================== */

  async function showCourses() {

    showContent(
      '<div class="loading">課程載入中……</div>'
    );


    try {

      const result =
        await api(
          'getCourses',
          {}
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          '無法取得課程'
        );

      }


      const courses =
        result.courses || [];


      if (
        courses.length === 0
      ) {

        showContent(
          `
            <div class="card center">

              <h2>
                📚 課程
              </h2>

              <p>
                目前沒有課程
              </p>

            </div>
          `
        );

        return;

      }


      let html =
        `
          <div class="card">

            <h2>
              📚 課程列表
            </h2>
        `;


      courses.forEach(
        course => {

          const status =
            String(
              course.Status || ''
            ).toUpperCase();


          html +=
            `
              <div class="course">

                <div class="course-title">
                  ${escapeHtml(
                    course.CourseName || ''
                  )}
                </div>

                <div class="course-info">

                  📅
                  ${escapeHtml(
                    course.CourseDate || ''
                  )}

                  <br>

                  🕐
                  ${escapeHtml(
                    course.StartTime || ''
                  )}
                  -
                  ${escapeHtml(
                    course.EndTime || ''
                  )}

                  <br>

                  👨‍🏫
                  ${escapeHtml(
                    course.TeacherName || ''
                  )}

                  <br>

                  📍
                  ${escapeHtml(
                    course.Location || ''
                  )}

                </div>

                <div class="status ${getStatusClass(status)}">

                  ${getStatusText(status)}

                </div>

                ${
                  currentRole === 'ADMIN'
                  ||
                  currentRole === 'TEACHER'
                    ? `
                      <button
                        class="blue"
                        onclick="showCourseDetail('${escapeJs(course.CourseID)}')"
                      >
                        查看課程
                      </button>
                    `
                    : ''
                }

              </div>
            `;

        }
      );


      html +=
        `
          </div>
        `;


      showContent(
        html
      );


    } catch (error) {

      showContent(
        `
          <div class="card">

            <div class="error">
              ${escapeHtml(error.message)}
            </div>

          </div>
        `
      );

    }

  }


  /* ==================================================
     課程詳細
     ================================================== */

  async function showCourseDetail(
    courseId
  ) {

    showContent(
      '<div class="loading">載入中……</div>'
    );


    try {

      const result =
        await api(
          'getCourse',
          {

            CourseID:
              courseId

          }
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          '無法取得課程'
        );

      }


      const course =
        result.course;


      let html =
        `
          <div class="card">

            <h2>
              📚
              ${escapeHtml(
                course.CourseName || ''
              )}
            </h2>

            <div class="course-info">

              📅
              ${escapeHtml(
                course.CourseDate || ''
              )}

              <br>

              🕐
              ${escapeHtml(
                course.StartTime || ''
              )}
              -
              ${escapeHtml(
                course.EndTime || ''
              )}

              <br>

              👨‍🏫
              ${escapeHtml(
                course.TeacherName || ''
              )}

              <br>

              📍
              ${escapeHtml(
                course.Location || ''
              )}

            </div>
        `;


      if (
        currentRole ===
        'ADMIN'
        ||
        (
          currentRole ===
          'TEACHER'
          &&
          String(
            course.TeacherID
          ) ===
          String(
            currentUser.UserID
          )
        )
      ) {

        html +=
          `
            <button
              class="blue"
              onclick="showCourseAttendance('${escapeJs(course.CourseID)}')"
            >
              📋 查看簽到紀錄
            </button>
          `;


        if (
          course.QRCode
        ) {

          html +=
            `
              <button
                class="purple"
                onclick="showCourseQR('${escapeJs(course.CourseID)}')"
              >
                📱 顯示 QR Code
              </button>
            `;

  /* ==================================================
     API
     ================================================== */

  async function api(
    action,
    data
  ) {

    const payload =
      Object.assign(
        {},
        data,
        {
          action:
            action
        }
      );


    const response =
      await fetch(
        CONFIG.API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const text =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        '伺服器回傳格式錯誤'
      );

    }


    return result;

  }

  /* ==================================================
     防止 HTML Injection
     ================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value === undefined ||
      value === null
        ? ''
        : value
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  function escapeJs(
    value
  ) {

    return String(
      value || ''
    )
      .replace(
        /\\/g,
        '\\\\'
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /"/g,
        '\\"'
      );

  }
