<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>臺北市體育運動教練職業工會｜課程簽到系統</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 30px 10px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.5;
      font-weight: 700;
    }

    .header p {
      margin: 8px 0 0;
      color: #777;
      font-size: 15px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .welcome p {
      color: #777;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #06c755;
      color: white;
    }

    button:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    .danger {
      background: #d9534f;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #06c755;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      line-height: 1.6;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e8f8ef;
      color: #167a43;
    }

    .message.error {
      background: #fff0f0;
      color: #c62828;
    }

    .message.info {
      background: #eef5ff;
      color: #2864b0;
    }

    .user-info {
      text-align: center;
      margin-bottom: 15px;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
    }

    .role {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: #eee;
      font-size: 13px;
    }

    .course {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .course-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .course-info {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
      background: #eee;
    }

    .status.open {
      background: #e8f8ef;
      color: #167a43;
    }

    .status.closed {
      background: #eee;
      color: #777;
    }

    .attendance-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .attendance-item:last-child {
      border-bottom: none;
    }

    .attendance-course {
      font-weight: 700;
    }

    .attendance-time {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      padding: 30px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 標題 -->
  <div class="header">
    <h1>臺北市體育運動教練職業工會</h1>
    <p>課程簽到系統</p>
  </div>


  <!-- 系統訊息 -->
  <div id="message" class="message"></div>


  <!-- =========================
       登入頁
       ========================= -->
  <section id="loginPage">

    <div class="card welcome">

      <h2>歡迎使用</h2>

      <p>
        請使用 LINE 登入課程簽到系統
      </p>

      <button
        id="lineLoginBtn"
        onclick="loginWithLine()">
        使用 LINE 登入
      </button>

    </div>

  </section>


  <!-- =========================
       學員登入
       ========================= -->
  <section id="studentLoginPage" class="hidden">

    <div class="card">

      <h2>學員登入</h2>

      <p>
        請輸入您在工會登記的姓名。
      </p>

      <label>
        學員姓名
      </label>

      <input
        id="studentName"
        type="text"
        placeholder="請輸入姓名">

      <div id="phoneArea" class="hidden">

        <label>
          手機號碼
        </label>

        <input
          id="studentPhone"
          type="tel"
          placeholder="請輸入手機號碼">

        <p style="font-size:13px;color:#888;">
          系統找到多位同名學員，請輸入手機號碼確認身分。
        </p>

      </div>

      <button
        id="studentLoginBtn"
        onclick="studentLogin()">
        登入
      </button>

    </div>

  </section>


  <!-- =========================
       首頁
       ========================= -->
  <section id="homePage" class="hidden">

    <div class="card">

      <div class="user-info">

        <div
          id="userName"
          class="user-name">
        </div>

        <div
          id="userRole"
          class="role">
        </div>

      </div>

      <button onclick="loadCourses()">
        查看課程
      </button>

      <button
        class="secondary"
        onclick="loadAttendance()">
        查看簽到紀錄
      </button>

      <button
        class="secondary"
        onclick="logout()">
        登出
      </button>

    </div>

  </section>


  <!-- =========================
       課程列表
       ========================= -->
  <section id="coursesPage" class="hidden">

    <div class="card">

      <h2>課程列表</h2>

      <div id="coursesList">
        <div class="loading">
          載入課程中……
        </div>
      </div>

      <button
        class="secondary"
        onclick="showHome()">
        返回
      </button>

    </div>

  </section>


  <!-- =========================
       簽到紀錄
       ========================= -->
  <section id="attendancePage" class="hidden">

    <div class="card">

      <h2>我的簽到紀錄</h2>

      <div id="attendanceList">
        <div class="loading">
          載入紀錄中……
        </div>
      </div>

      <button
        class="secondary"
        onclick="showHome()">
        返回
      </button>

    </div>

  </section>


  <div class="footer">
    臺北市體育運動教練職業工會<br>
    課程簽到系統 V2.0
  </div>

</div>


<script>

  /* ==================================================
     系統設定
     ================================================== */

  const LIFF_ID =
    "2011196867-72x76BlI";

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzoll0ZZHiHeqCs12p0O9aqdwfWmjgIYKprSRK729RChjuEMQHPF7EyU9TgxjMdGxyI/exec";


  let idToken = null;

  let lineProfile = null;

  let currentStudent = null;

  let currentUser = null;

  let currentRole = null;


  /* ==================================================
     初始化
     ================================================== */

  async function init() {

    try {

      showMessage(
        "系統初始化中……",
        "info"
      );

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        hideAllPages();

        document
          .getElementById("loginPage")
          .classList.remove("hidden");

        hideMessage();

        return;

      }


      await loadLineUser();


    } catch (error) {

      console.error(error);

      showMessage(
        "系統初始化失敗：" +
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     LINE 登入
     ================================================== */

  async function loginWithLine() {

    try {

      if (!liff.isLoggedIn()) {

        liff.login();

        return;

      }

      await loadLineUser();

    } catch (error) {

      console.error(error);

      showMessage(
        "LINE 登入失敗：" +
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     取得 LINE 使用者
     ================================================== */

  async function loadLineUser() {

    try {

      idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          "無法取得 LINE 登入資訊"
        );

      }


      lineProfile =
        await liff.getProfile();


      const result =
        await api(
          "checkUser",
          {
            idToken: idToken
          }
        );


      if (!result.success) {

        throw new Error(
          result.error ||
          "登入失敗"
        );

      }


      if (result.registered) {

        currentRole =
          result.role;


        if (
          result.role === "STUDENT"
        ) {

          currentStudent =
            result.student;

          showHome();

        }

        else {

          currentUser =
            result.user;

          showHome();

        }

        return;

      }


      /*
       * 尚未綁定
       * 顯示學員登入
       */

      hideAllPages();

      document
        .getElementById(
          "studentLoginPage"
        )
        .classList.remove(
          "hidden"
        );

      hideMessage();


    } catch (error) {

      console.error(error);

      showMessage(
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     學員登入
     ================================================== */

  async function studentLogin() {

    const name =
      document
        .getElementById(
          "studentName"
        )
        .value
        .trim();


    const phone =
      document
        .getElementById(
          "studentPhone"
        )
        .value
        .trim();


    if (!name) {

      showMessage(
        "請輸入學員姓名",
        "error"
      );

      return;

    }


    const button =
      document
        .getElementById(
          "studentLoginBtn"
        );


    button.disabled = true;

    button.innerText =
      "登入中……";


    try {

      /*
       * 第一次先只用姓名查詢
       */

      let result =
        await api(
          "findStudentByName",
          {
            idToken: idToken,
            Name: name
          }
        );


      if (!result.success) {

        throw new Error(
          result.error ||
          "登入失敗"
        );

      }


      /*
       * 沒有找到
       */

      if (
        result.count === 0
      ) {

        throw new Error(
          "找不到此姓名的學員資料，請確認姓名是否正確。"
        );

      }


      /*
       * 同名
       */

      if (
        result.count > 1 &&
        !phone
      ) {

        document
          .getElementById(
            "phoneArea"
          )
          .classList.remove(
            "hidden"
          );

        showMessage(
          "系統找到多位同名學員，請輸入手機號碼。",
          "info"
        );

        return;

      }


      /*
       * 真正登入
       */

      result =
        await api(
          "loginStudent",
          {
            idToken: idToken,
            Name: name,
            Phone: phone
          }
        );


      if (!result.success) {

        throw new Error(
          result.error ||
          "登入失敗"
        );

      }


      currentStudent =
        result.student;

      currentRole =
        "STUDENT";


      showMessage(
        "登入成功！",
        "success"
      );


      setTimeout(
        showHome,
        500
      );


    } catch (error) {

      console.error(error);

      showMessage(
        error.message,
        "error"
      );

    }


    finally {

      button.disabled = false;

      button.innerText =
        "登入";

    }

  }


  /* ==================================================
     顯示首頁
     ================================================== */

  function showHome() {

    hideAllPages();

    document
      .getElementById(
        "homePage"
      )
      .classList.remove(
        "hidden"
      );


    const nameElement =
      document.getElementById(
        "userName"
      );

    const roleElement =
      document.getElementById(
        "userRole"
      );


    if (
      currentRole === "STUDENT" &&
      currentStudent
    ) {

      nameElement.innerText =
        currentStudent.Name || "";

      roleElement.innerText =
        "學員";

    }

    else if (currentUser) {

      nameElement.innerText =
        currentUser.Name || "";

      roleElement.innerText =
        roleText(
          currentUser.Role
        );

    }


    hideMessage();

  }


  /* ==================================================
     課程
     ================================================== */

  async function loadCourses() {

    hideAllPages();

    document
      .getElementById(
        "coursesPage"
      )
      .classList.remove(
        "hidden"
      );


    const list =
      document.getElementById(
        "coursesList"
      );


    list.innerHTML =
      '<div class="loading">載入課程中……</div>';


    try {

      const result =
        await api(
          "getCourses",
          {
            idToken: idToken
          }
        );


      if (!result.success) {

        throw new Error(
          result.error
        );

      }


      const courses =
        result.courses || [];


      if (courses.length === 0) {

        list.innerHTML =
          '<div class="loading">目前沒有課程。</div>';

        return;

      }


      list.innerHTML =
        "";


      courses
        .sort(
          (a,b) =>
            String(
              a.CourseDate
            )
            .localeCompare(
              String(
                b.CourseDate
              )
            )
        )
        .forEach(
          course => {

            const div =
              document.createElement(
                "div"
              );

            div.className =
              "course";


            const status =
              String(
                course.Status || ""
              )
              .toUpperCase();


            div.innerHTML = `

              <div class="course-name">
                ${escapeHtml(
                  course.CourseName || ""
                )}
              </div>

              <div class="course-info">

                日期：
                ${escapeHtml(
                  course.CourseDate || ""
                )}

                <br>

                時間：
                ${escapeHtml(
                  course.StartTime || ""
                )}
                -
                ${escapeHtml(
                  course.EndTime || ""
                )}

                <br>

                地點：
                ${escapeHtml(
                  course.Location || "未提供"
                )}

                <br>

                老師：
                ${escapeHtml(
                  course.TeacherName || "未提供"
                )}

              </div>

              <span class="status ${
                status === "OPEN"
                  ? "open"
                  : "closed"
              }">

                ${statusText(status)}

              </span>

              ${
                currentRole === "STUDENT" &&
                status === "OPEN"
                  ? `
                    <button
                      onclick="checkIn('${escapeJs(
                        course.CourseID
                      )}')">
                      課程簽到
                    </button>
                    `
                  : ""
              }

            `;


            list.appendChild(
              div
            );

          }
        );


    } catch (error) {

      list.innerHTML =
        "";

      showMessage(
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     簽到
     ================================================== */

  async function checkIn(
    courseId
  ) {

    if (
      !confirm(
        "確定要進行課程簽到嗎？"
      )
    ) {

      return;

    }


    try {

      const result =
        await api(
          "checkIn",
          {
            idToken:
              idToken,

            CourseID:
              courseId
          }
        );


      if (!result.success) {

        throw new Error(
          result.error
        );

      }


      if (
        result.alreadyCheckedIn
      ) {

        showMessage(
          "您已完成此課程簽到。",
          "info"
        );

      }

      else {

        showMessage(
          "簽到成功！",
          "success"
        );

      }


    } catch (error) {

      showMessage(
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     簽到紀錄
     ================================================== */

  async function loadAttendance() {

    hideAllPages();

    document
      .getElementById(
        "attendancePage"
      )
      .classList.remove(
        "hidden"
      );


    const list =
      document.getElementById(
        "attendanceList"
      );


    list.innerHTML =
      '<div class="loading">載入紀錄中……</div>';


    try {

      const result =
        await api(
          "getAttendance",
          {
            idToken:
              idToken
          }
        );


      if (!result.success) {

        throw new Error(
          result.error
        );

      }


      const records =
        result.attendance || [];


      if (
        records.length === 0
      ) {

        list.innerHTML =
          '<div class="loading">目前沒有簽到紀錄。</div>';

        return;

      }


      list.innerHTML =
        "";


      records
        .reverse()
        .forEach(
          record => {

            const div =
              document.createElement(
                "div"
              );

            div.className =
              "attendance-item";


            div.innerHTML = `

              <div class="attendance-course">
                ${escapeHtml(
                  record.CourseID || ""
                )}
              </div>

              <div class="attendance-time">
                簽到時間：
                ${escapeHtml(
                  record.CheckInTime || ""
                )}
              </div>

              <div class="attendance-time">
                狀態：
                ${escapeHtml(
                  record.Status || ""
                )}
              </div>

            `;


            list.appendChild(
              div
            );

          }
        );


    } catch (error) {

      list.innerHTML =
        "";

      showMessage(
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     API
     ================================================== */

  async function api(
    action,
    data = {}
  ) {

    const payload = {

      action:
        action,

      ...data

    };


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if (!response.ok) {

      throw new Error(
        "API 連線失敗：" +
        response.status
      );

    }


    return await response.json();

  }


  /* ==================================================
     登出
     ================================================== */

  function logout() {

    try {

      if (
        liff.isLoggedIn()
      ) {

        liff.logout();

      }

    } catch (error) {

      console.error(error);

    }


    location.reload();

  }


  /* ==================================================
     頁面
     ================================================== */

  function hideAllPages() {

    [

      "loginPage",

      "studentLoginPage",

      "homePage",

      "coursesPage",

      "attendancePage"

    ]
    .forEach(
      id => {

        document
          .getElementById(id)
          .classList.add(
            "hidden"
          );

      }
    );

  }


  function showMessage(
    text,
    type = "info"
  ) {

    const box =
      document.getElementById(
        "message"
      );


    box.innerText =
      text;


    box.className =
      "message show " +
      type;

  }


  function hideMessage() {

    const box =
      document.getElementById(
        "message"
      );


    box.className =
      "message";

  }


  /* ==================================================
     角色文字
     ================================================== */

  function roleText(
    role
  ) {

    switch (
      String(
        role || ""
      ).toUpperCase()
    ) {

      case "ADMIN":
        return "管理者";

      case "TEACHER":
        return "老師";

      case "STUDENT":
        return "學員";

      default:
        return role || "";

    }

  }


  /* ==================================================
     課程狀態
     ================================================== */

  function statusText(
    status
  ) {

    switch (
      String(
        status || ""
      ).toUpperCase()
    ) {

      case "OPEN":
        return "開放簽到";

      case "CLOSED":
        return "已關閉";

      case "CANCELLED":
        return "已取消";

      case "DRAFT":
        return "草稿";

      default:
        return status || "未知";

    }

  }


  /* ==================================================
     HTML 安全
     ================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value || ""
    )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

  }


  function escapeJs(
    value
  ) {

    return String(
      value || ""
    )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );

  }


  /* ==================================================
     啟動
     ================================================== */

  window.addEventListener(
    "load",
    init
  );

</script>

</body>
</html>
