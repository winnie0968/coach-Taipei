<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>課程簽到系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f5f7fa;
      color: #333;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.5;
    }

    .header p {
      margin: 8px 0 0;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .error-box {
      background: #fff0f0;
      border: 1px solid #ffcaca;
      color: #c62828;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success-box {
      background: #effaf1;
      border: 1px solid #bde5c3;
      color: #277a35;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .login-title {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #777;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-primary {
      background: #06c755;
      color: white;
    }

    .btn-primary:hover {
      background: #05b34c;
    }

    .btn-secondary {
      background: #eeeeee;
      color: #333;
    }

    .btn-danger {
      background: #e53935;
      color: white;
    }

    .btn-dark {
      background: #333;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
    }

    .user-name {
      font-size: 18px;
      font-weight: bold;
    }

    .role-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: 13px;
    }

    .role-admin {
      background: #ffe8e8;
      color: #c62828;
    }

    .role-teacher {
      background: #e8f1ff;
      color: #1565c0;
    }

    .role-student {
      background: #e8f8ec;
      color: #2e7d32;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu-button {
      border: 1px solid #e1e1e1;
      background: white;
      padding: 15px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .menu-button:hover {
      background: #f7f7f7;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .course-card {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .course-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .course-info {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 7px;
    }

    .status-open {
      background: #e6f7ea;
      color: #2e7d32;
    }

    .status-draft {
      background: #eeeeee;
      color: #666;
    }

    .status-closed {
      background: #eeeeee;
      color: #666;
    }

    .status-cancelled {
      background: #ffe8e8;
      color: #c62828;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #999;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .record {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .record:last-child {
      border-bottom: none;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 20px 0;
    }

    @media (max-width: 500px) {

      .container {
        padding: 14px;
      }

      .card {
        padding: 18px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

       ================================================ -->

  <!-- ================================================

    <div class="section-title">

    </div>

  <!-- ================================================

    <!-- 使用者資訊 -->

    <div class="card">

      <div class="user-info">

    <div

    >

      <div class="section-title">

      </div>

      <div class="menu-grid">

        <button
          class="menu-button"
          onclick="showCourses()"
        >
          📚 我的課程
        </button>

        <button
          class="menu-button"
          onclick="showCreateCourse()"
        >
          ➕ 建立課程
        </button>

        <button
          class="menu-button"
          onclick="showAttendance()"
        >
          📋 查看簽到紀錄
        </button>

    </div>


    <!-- 學員 -->

    <div
      id="studentPanel"
      class="card hidden"
    >

      <div class="section-title">
        學員功能
      </div>

      <div class="menu-grid">

        <button

<script>

/* ==================================================
   1. 系統設定
   ================================================== */

const APP_CONFIG = {

  LIFF_ID:
    '2011196867-72x76BlI',

  API_URL:
    'https://script.google.com/macros/s/AKfycbzoll0ZZHiHeqCs12p0O9aqdwfWmjgIYKprSRK729RChjuEMQHPF7EyU9TgxjMdGxyI/exec'

};


/* ==================================================
   2. 全域狀態
   ================================================== */

let currentUser = {

  lineUserId: '',

  displayName: '',

  pictureUrl: '',

  role: '',

  student: null,

  user: null

};


let courses = [];


/* ==================================================
   3. 頁面啟動
   ================================================== */

document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init() {

  try {

    showLoading();

    /*
     * 檢查設定
     */

    if (
      !APP_CONFIG.LIFF_ID
    ) {

      throw new Error(
        '尚未設定 LIFF ID'
      );

    }


    if (
      !APP_CONFIG.API_URL ||
      !APP_CONFIG.API_URL.includes(
        '/exec'
      )
    ) {

      throw new Error(
        '尚未設定 Apps Script Web App /exec 網址'
      );

    }


    /*
     * 初始化 LIFF
     */

    await liff.init({

      liffId:
        APP_CONFIG.LIFF_ID

    });


    /*
     * 如果尚未登入 LINE
     */

    if (
      !liff.isLoggedIn()
    ) {

      showLogin();

      return;

    }


    /*
     * 取得 LINE ID Token
     */

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        '無法取得 LINE ID Token，請重新登入 LINE'
      );

    }


    /*
     * 檢查系統使用者
     */

    const result =
      await api(
        'checkUser',
        {
          idToken:
            idToken
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '無法取得使用者資料'
      );

    }


    /*
     * 儲存 LINE 使用者資料
     */

    currentUser.lineUserId =
      result.lineUserId || '';

    currentUser.displayName =
      result.displayName || '';

    currentUser.role =
      result.role || '';

    currentUser.student =
      result.student || null;

    currentUser.user =
      result.user || null;


    /*
     * 已經登入
     */

    if (
      result.registered
    ) {

      await loadProfile();

      showDashboard();

      return;

    }


    /*
     * 尚未建立學員／老師／管理員身分
     *
     * 顯示學員登入
     */

    showStudentLogin();

  } catch (error) {

    showInitError(
      error.message
    );

  }

}


/* ==================================================
   4. LINE 登入
   ================================================== */

function startLineLogin() {

  try {

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }

    init();

  } catch (error) {

    showLoginError(
      error.message
    );

  }

}


/* ==================================================
   5. API
   ================================================== */

async function api(
  action,
  data = {}
) {

  const payload =
    Object.assign(
      {},
      data,
      {
        action:
          action
      }
    );


  const response =
    await fetch(
      APP_CONFIG.API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      '伺服器連線失敗：' +
      response.status
    );

  }


  const result =
    await response.json();


  return result;

}


/* ==================================================
   6. 取得個人資料
   ================================================== */

async function loadProfile() {

  const idToken =
    liff.getIDToken();


  if (!idToken) {

    throw new Error(
      '無法取得 LINE ID Token'
    );

  }


  /*
   * 學員
   */

  if (
    currentUser.role ===
    'STUDENT'
  ) {

    const result =
      await api(
        'getStudent',
        {
          idToken:
            idToken
        }
      );


    if (
      result.success
    ) {

      currentUser.student =
        result.student;

    }

  }


  /*
   * 老師／管理員
   */

  else {

    const result =
      await api(
        'checkUser',
        {
          idToken:
            idToken
        }
      );


    if (
      result.success
    ) {

      currentUser.user =
        result.user || null;

      currentUser.role =
        result.role || currentUser.role;

    }

  }

}


/* ==================================================
   7. 顯示 Loading
   ================================================== */

function showLoading() {

  document
    .getElementById(
      'loadingCard'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'loginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'studentLoginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'dashboard'
    )
    .classList
    .add(
      'hidden'
    );

}


/* ==================================================
   8. 顯示 LINE 登入
   ================================================== */

function showLogin() {

  document
    .getElementById(
      'loadingCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'studentLoginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'dashboard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'loginCard'
    )
    .classList
    .remove(
      'hidden'
    );

}


/* ==================================================
   9. 顯示學員登入
   ================================================== */

function showStudentLogin() {

  document
    .getElementById(
      'loadingCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'loginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'dashboard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'studentLoginCard'
    )
    .classList
    .remove(
      'hidden'
    );

}


/* ==================================================
   10. 學員登入
   ================================================== */

async function studentLogin() {

  const name =
    document
      .getElementById(
        'studentName'
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        'studentPhone'
      )
      .value
      .trim();


  const messageBox =
    document
      .getElementById(
        'studentLoginMessage'
      );


  messageBox.classList.add(
    'hidden'
  );


  if (!name) {

    showStudentMessage(
      '請輸入學員姓名'
    );

    return;

  }


  try {

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'LINE 登入資訊已失效，請重新登入'
      );

    }


    const result =
      await api(
        'loginStudent',
        {

          idToken:
            idToken,

          Name:
            name,

          Phone:
            phone

        }
      );


    /*
     * 同名
     */

    if (
      result.needPhone
    ) {

      document
        .getElementById(
          'studentPhoneGroup'
        )
        .classList
        .remove(
          'hidden'
        );


      showStudentMessage(
        '找到多位同名學員，請輸入手機號碼後再次按「登入」。',
        false
      );

      return;

    }


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '登入失敗'
      );

    }


    /*
     * 登入成功
     */

    currentUser.lineUserId =
      result.lineUserId || '';

    currentUser.role =
      result.role || 'STUDENT';

    currentUser.student =
      result.student || null;


    document
      .getElementById(
        'studentPhoneGroup'
      )
      .classList
      .add(
        'hidden'
      );


    showSuccess(
      '登入成功'
    );


    await sleep(
      500
    );


    showDashboard();

  } catch (error) {

    showStudentMessage(
      error.message
    );

  }

}


/* ==================================================
   11. 顯示學員登入訊息
   ================================================== */

function showStudentMessage(
  message,
  isError = true
) {

  const box =
    document
      .getElementById(
        'studentLoginMessage'
      );


  box.textContent =
    message;


  box.classList.remove(
    'hidden'
  );


  box.classList.remove(
    'success-box'
  );


  box.classList.remove(
    'error-box'
  );


  box.classList.add(
    isError
      ? 'error-box'
      : 'success-box'
  );

}


/* ==================================================
   12. Dashboard
   ================================================== */

function showDashboard() {

  document
    .getElementById(
      'loadingCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'loginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'studentLoginCard'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'dashboard'
    )
    .classList
    .remove(
      'hidden'
    );


  updateUserInterface();

}


/* ==================================================
   13. 更新身分介面
   ================================================== */

function updateUserInterface() {

  const role =
    String(
      currentUser.role || ''
    )
      .trim()
      .toUpperCase();


  const adminPanel =
    document.getElementById(
      'adminPanel'
    );


  const teacherPanel =
    document.getElementById(
      'teacherPanel'
    );


  const studentPanel =
    document.getElementById(
      'studentPanel'
    );

  ) {

    name =

  }


  document
    .getElementById(
      'userName'

  /*
   * 身分文字
   */

  let roleText =

    role === 'ADMIN'
  ) {

    roleText =
      '管理員 / ADMIN';

  }

  else if (
    role === 'TEACHER'
  ) {

    roleText =
      '老師 / TEACHER';

  }

  else if (
    role === 'STUDENT'
  ) {

    roleText =
      '學員 / STUDENT';

  }

    document.getElementById(
      'userRole'
    );


  roleElement.textContent =
    roleText;


  roleElement.className =

  if (
    role === 'ADMIN'

    roleElement.classList.add(

/* ==================================================
   16. 課程卡片
   ================================================== */

function createCourseCard(
  course
) {

  const status =
    String(
      course.Status || ''
    ).toUpperCase();


  let statusText =
    status;


  if (
    status === 'OPEN'
  ) {

    statusText =
      '開放簽到';

  }

  else if (
    status === 'DRAFT'
  ) {

    statusText =
      '草稿';

  }

  else if (
    status === 'CLOSED'
  ) {

    statusText =
      '已關閉';

  }

  else if (
    status === 'CANCELLED'
  ) {

    statusText =
      '已取消';

  }


  let statusClass =
    'status';


  if (
    status === 'OPEN'
  ) {

    statusClass +=
      ' status-open';

  }

  else if (
    status === 'CANCELLED'
  ) {

    statusClass +=
      ' status-cancelled';

  }

  else if (
    status === 'DRAFT'
  ) {

    statusClass +=
      ' status-draft';

  }

  else {

    statusClass +=
      ' status-closed';

  }


  let buttons = '';


  /*
   * 學員
   */

  if (
    currentUser.role ===
    'STUDENT'
  ) {

    if (
      status === 'OPEN'
    ) {

      buttons +=
        '<button class="btn btn-primary" ' +
        'onclick="checkIn(\'' +
        escapeJs(
          course.CourseID
        ) +
        '\')">' +
        '✅ 簽到' +
        '</button>';

    }

  }


  /*
   * 老師／管理員
   */

  if (
    currentUser.role ===
      'TEACHER' ||
    currentUser.role ===
      'ADMIN'
  ) {

    buttons +=
      '<button class="btn btn-secondary" ' +
      'onclick="viewCourseAttendance(\'' +
      escapeJs(
        course.CourseID
      ) +
      '\')">' +
      '📋 簽到紀錄' +
      '</button>';


    if (
      currentUser.role ===
        'ADMIN' ||
      String(
        course.TeacherID || ''
      ) ===
      String(
        currentUser.user &&
        currentUser.user.UserID || ''
      )
    ) {

      buttons +=
        '<button class="btn btn-secondary" ' +
        'onclick="editCourse(\'' +
        escapeJs(
          course.CourseID
        ) +
        '\')">' +
        '✏️ 編輯課程' +
        '</button>';


      if (
        status !== 'OPEN'
      ) {

        buttons +=
          '<button class="btn btn-primary" ' +
          'onclick="changeCourseStatus(\'' +
          escapeJs(
            course.CourseID
          ) +
          '\',\'openCourse\')">' +
          '開放簽到' +
          '</button>';

      }


      if (
        status === 'OPEN'
      ) {

        buttons +=
          '<button class="btn btn-secondary" ' +
          'onclick="changeCourseStatus(\'' +
          escapeJs(
            course.CourseID
          ) +
          '\',\'closeCourse\')">' +
          '關閉簽到' +
          '</button>';

      }


      if (
        status !== 'CANCELLED'
      ) {

        buttons +=
          '<button class="btn btn-danger" ' +
          'onclick="changeCourseStatus(\'' +
          escapeJs(
            course.CourseID
          ) +
          '\',\'cancelCourse\')">' +
          '取消課程' +
          '</button>';

      }

    }

  }


  return (

    '<div class="course-card">' +

      '<div class="course-name">' +
      escapeHtml(
        course.CourseName || ''
      ) +
      '</div>' +

      '<div class="course-info">' +

      '📅 日期：' +
      escapeHtml(
        course.CourseDate || ''
      ) +
      '<br>' +

      '🕐 時間：' +
      escapeHtml(
        course.StartTime || ''
      ) +
      ' - ' +
      escapeHtml(
        course.EndTime || ''
      ) +
      '<br>' +

      '👨‍🏫 老師：' +
      escapeHtml(
        course.TeacherName || ''
      ) +
      '<br>' +

      '📍 地點：' +
      escapeHtml(
        course.Location || '未設定'
      ) +

      '</div>' +

      '<span class="' +
      statusClass +
      '">' +
      escapeHtml(
        statusText
      ) +
      '</span>' +

      buttons +

    '</div>'

  );

}

async function checkIn(
  courseId
) {

  if (
    !confirm(
      '確定要簽到嗎？'
    )
  ) {

    return;

  }


  try {

    const idToken =
      liff.getIDToken();


    const result =
      await api(
        'checkIn',
        {

          idToken:
            idToken,

          CourseID:
            courseId

        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '簽到失敗'
      );

    }


    if (
      result.alreadyCheckedIn
    ) {

      alert(
        '您已完成簽到。'
      );

    }

    else {

      alert(
        '簽到成功！'
      );

    }


    showCourses();

  } catch (error) {

    alert(
      error.message
    );

  }

}

async function editCourse(
  courseId
) {

  const course =
    courses.find(
      item =>
        String(
          item.CourseID
        ) ===
        String(
          courseId
        )
    );


  if (!course) {

    /*
     * 如果目前列表沒有，
     * 重新取得
     */

    try {

      const result =
        await api(
          'getCourse',
          {
            CourseID:
              courseId
          }
        );


      if (
        !result.success
      ) {

        throw new Error(
          result.error
        );

      }


      openEditCourse(
        result.course
      );

    } catch (error) {

      alert(
        error.message
      );

    }

    return;

  }


  openEditCourse(
    course
  );

}

    action === 'openCourse'
  ) {

    text =
      '確定要開放這堂課簽到嗎？';

  }

  else if (
    action === 'closeCourse'
  ) {

    text =
      '確定要關閉這堂課簽到嗎？';

  }

  else if (
    action === 'cancelCourse'
  ) {

    text =
      '確定要取消這堂課嗎？';

  }


  if (
    !confirm(
      text
    )
  ) {

    return;

  }


  try {

    const idToken =
      liff.getIDToken();


    const result =
      await api(
        action,
        {

          idToken:
            idToken,

          CourseID:
            courseId

        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '操作失敗'
      );

    }


    alert(
      '操作成功'
    );


    showCourses();

  } catch (error) {

    alert(
      error.message
    );

  }

}


/* ==================================================
   27. 使用者管理
   ================================================== */

async function showUsers() {

  showContent(
    '<div class="section-title">' +
    '使用者管理' +
    '</div>' +

    '<div class="loading">' +
    '載入中……' +
    '</div>'
  );


  try {

    const idToken =
      liff.getIDToken();


    const result =
      await api(
        'getUsers',
        {
          idToken:
            idToken
        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '無法取得使用者'
      );

    }


    const users =
      result.users || [];


    let html =
      '<div class="section-title">' +
      '使用者管理' +
      '</div>';


    if (
      users.length === 0
    ) {

      html +=
        '<div class="empty">' +
        '目前沒有使用者' +
        '</div>';

    }


    users.forEach(
      user => {

        const role =
          String(
            user.Role || ''
          )
            .toUpperCase();


        html +=
          '<div class="course-card">' +

          '<div class="course-name">' +
          escapeHtml(
            user.Name || ''
          ) +
          '</div>' +

          '<div class="course-info">' +

          'UserID：' +
          escapeHtml(
            user.UserID || ''
          ) +
          '<br>' +

          'LINE：' +
          escapeHtml(
            user.LINE_User_ID || '未綁定'
          ) +
          '<br>' +

          '狀態：' +
          escapeHtml(
            user.Status || ''
          ) +

          '</div>' +

          '<select id="role_' +
          escapeAttr(
            user.UserID
          ) +
          '">' +

          '<option value="STUDENT" ' +
          (
            role === 'STUDENT'
              ? 'selected'
              : ''
          ) +
          '>STUDENT</option>' +

          '<option value="TEACHER" ' +
          (
            role === 'TEACHER'
              ? 'selected'
              : ''
          ) +
          '>TEACHER</option>' +

          '<option value="ADMIN" ' +
          (
            role === 'ADMIN'
              ? 'selected'
              : ''
          ) +
          '>ADMIN</option>' +

          '</select>' +

          '<button class="btn btn-primary" ' +
          'onclick="updateUserRole(\'' +
          escapeJs(
            user.UserID
          ) +
          '\')">' +
          '儲存角色' +
          '</button>' +

          '</div>';

      }
    );


    html +=
      '<button class="btn btn-secondary" ' +
      'onclick="backToDashboard()">' +
      '返回' +
      '</button>';


    showContent(
      html
    );

  } catch (error) {

    showContent(
      '<div class="error-box">' +
      escapeHtml(
        error.message
      ) +
      '</div>'
    );

  }

}


/* ==================================================
   28. 修改角色
   ================================================== */

async function updateUserRole(
  userId
) {

  const select =
    document.getElementById(
      'role_' +
      userId
    );


  const role =
    select.value;


  try {

    const idToken =
      liff.getIDToken();


    const result =
      await api(
        'updateUserRole',
        {

          idToken:
            idToken,

          UserID:
            userId,

          Role:
            role

        }
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '角色修改失敗'
      );

    }


    alert(
      '角色修改成功'
    );


    showUsers();

  } catch (error) {

    alert(
      error.message
    );

  }

}

function showContent(

) {

  document
    .getElementById(
      'dashboard'
    )
    .classList
    .remove(
      'hidden'
    );

    document.getElementById(
      'contentCard'
    );

  );

  });

  window.scrollTo({

    behavior:

  });

}

function closeModal(event) {

  if (
    event &&
    event.target !== event.currentTarget

  }


  document
    .getElementById(
      'modal'
    )
    .classList
    .add(
      'hidden'
    );

}

/* ==================================================
   38. HTML 安全處理
   ================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}


function escapeJs(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(
    value
  )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      '\\r'
    )
    .replace(
      /\n/g,
      '\\n'
    );

}
