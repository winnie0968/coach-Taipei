<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>臺北市體育運動教練職業工會｜課程簽到系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1100px, 94%);
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 22px 0;
      margin-bottom: 25px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header-subtitle {
      color: #666;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .login-card {
      max-width: 520px;
      margin: 70px auto;
      text-align: center;
    }

    .login-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .login-description {
      color: #666;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .92;
    }

    .btn-primary {
      background: #06c755;
      color: white;
    }

    .btn-dark {
      background: #222;
      color: white;
    }

    .btn-secondary {
      background: #e9ecef;
      color: #333;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-success {
      background: #198754;
      color: white;
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error-box {
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #f5c2c7;
      border-radius: 10px;
      padding: 14px;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .success-box {
      background: #edfdf3;
      color: #067647;
      border: 1px solid #abefc6;
      border-radius: 10px;
      padding: 14px;
      margin-top: 15px;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #eee;
      object-fit: cover;
    }

    .user-name {
      font-weight: 700;
    }

    .role-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      margin-top: 4px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .nav button {
      border: 0;
      background: #f0f2f5;
      padding: 10px 14px;
      border-radius: 9px;
    }

    .nav button.active {
      background: #222;
      color: white;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .course-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
    }

    .course-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .course-info {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }

    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .status-open {
      background: #dcfce7;
      color: #166534;
    }

    .status-draft {
      background: #f3f4f6;
      color: #374151;
    }

    .status-closed {
      background: #e5e7eb;
      color: #374151;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .course-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-control {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 11px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8f9fa;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #777;
    }

    .student-login {
      max-width: 500px;
      margin: 0 auto;
    }

    .top-message {
      margin-bottom: 20px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      font-size: 24px;
    }

    .login-help {
      font-size: 13px;
      color: #777;
      margin-top: 15px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {

      .card {
        padding: 18px;
      }

      .header-title {
        font-size: 20px;
      }

      table {
        display: block;
        overflow-x: auto;
      }

    }

  </style>
</head>

<body>

<!-- ==================================================
     HEADER
     ================================================== -->

<header>
  <div class="container">

    <div class="header-title">
      臺北市體育運動教練職業工會
    </div>

    <div class="header-subtitle">
      課程簽到系統
    </div>

  </div>
</header>


<!-- ==================================================
     MAIN
     ================================================== -->

<main class="container">

  <!-- 初始化 -->
  <div id="loadingScreen" class="card loading">
    系統載入中……
  </div>


  <!-- ==================================================
       LOGIN
       ================================================== -->

  <section id="loginScreen"
           class="card login-card hidden">

    <div class="login-title">
      課程簽到系統
    </div>

    <div class="login-description">
      請使用 LINE 登入課程簽到系統
    </div>

    <button
      id="lineLoginButton"
      class="btn btn-primary"
      style="width:100%;">

      使用 LINE 登入

    </button>

    <div id="loginError"
         class="error-box hidden">
    </div>

    <div class="login-help">

      登入後，系統會依照您的帳號權限顯示
      學員、老師或管理員功能。

    </div>

  </section>


  <!-- ==================================================
       STUDENT FIRST LOGIN
       ================================================== -->

  <section id="studentLoginScreen"
           class="card hidden">

    <div class="student-login">

      <div class="section-title">
        學員登入
      </div>

      <p style="color:#666;line-height:1.7;">
        請輸入您的學員姓名。
        如果系統找到多位同名學員，
        才會要求輸入手機號碼確認身份。
      </p>

      <div class="form-group">

        <label class="form-label">
          學員姓名
        </label>

        <input
          id="studentName"
          class="form-control"
          type="text"
          placeholder="請輸入姓名">

      </div>

      <div id="phoneGroup"
           class="form-group hidden">

        <label class="form-label">
          手機號碼
        </label>

        <input
          id="studentPhone"
          class="form-control"
          type="tel"
          placeholder="請輸入手機號碼">

      </div>

      <button
        id="studentLoginButton"
        class="btn btn-primary"
        style="width:100%;">

        登入

      </button>

      <div id="studentLoginMessage"
           class="error-box hidden">
      </div>

    </div>

  </section>


  <!-- ==================================================
       APP
       ================================================== -->

  <section id="appScreen"
           class="hidden">

    <!-- 使用者資訊 -->
    <div class="card">

      <div class="user-bar">

        <div class="user-info">

          <img
            id="userAvatar"
            class="avatar"
            src=""
            alt="">

          <div>

            <div id="userName"
                 class="user-name">
              使用者
            </div>

            <div id="userRole"
                 class="role-badge">
              USER
            </div>

          </div>

        </div>

        <button
          id="logoutButton"
          class="btn btn-secondary">

          登出

        </button>

      </div>


      <!-- 導覽 -->
      <div id="navigation"
           class="nav">

      </div>

    </div>


    <!-- 系統訊息 -->
    <div id="topMessage"
         class="top-message hidden">
    </div>


    <!-- ==================================================
         CONTENT
         ================================================== -->

    <div id="contentArea">

    </div>

  </section>

</main>


<!-- ==================================================
     MODAL
     ================================================== -->

<div id="modal"
     class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">

      <div id="modalTitle"
           class="section-title"
           style="margin:0;">
      </div>

      <button
        class="close-btn"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div id="modalBody">
    </div>

  </div>

</div>


<script>

/* ==================================================
   1. 系統設定
   ================================================== */

const CONFIG = {

  // ★★★ 改成你目前 Apps Script Web App 的 /exec 網址 ★★★
  API_URL:
    '請貼上你的 Apps Script Web App /exec 網址',

  LIFF_ID:
    '2011196867-72x76BlI'

};


/* ==================================================
   2. 全域狀態
   ================================================== */

let currentUser = null;

let currentRole = null;

let currentStudent = null;

let currentCourses = [];

let currentAttendance = [];


/* ==================================================
   3. DOM
   ================================================== */

const $ = id =>
  document.getElementById(id);


/* ==================================================
   4. 啟動
   ================================================== */

document.addEventListener(
  'DOMContentLoaded',
  initApp
);


async function initApp() {

  try {

    if (
      !CONFIG.API_URL ||
      CONFIG.API_URL.includes(
        '請貼上'
      )
    ) {

      throw new Error(
        '尚未設定 Apps Script Web App /exec 網址'
      );

    }


    /*
     * 先初始化 LIFF
     *
     * LINE 官方要求：
     * 先 liff.init()
     * 再使用其他 LIFF API
     */

    await liff.init({

      liffId:
        CONFIG.LIFF_ID,

      withLoginOnExternalBrowser:
        false

    });


    /*
     * LIFF 初始化成功
     */

    console.log(
      'LIFF initialized:',
      liff.id
    );


    /*
     * 尚未登入 LINE
     */

    if (
      !liff.isLoggedIn()
    ) {

      showLoginScreen();

      return;

    }


    /*
     * 已經登入 LINE
     */

    await continueAfterLineLogin();


  } catch (error) {

    console.error(
      error
    );

    showInitError(
      error
    );

  }

}


/* ==================================================
   5. 顯示 LINE 登入頁
   ================================================== */

function showLoginScreen() {

  $('loadingScreen')
    .classList
    .add('hidden');

  $('loginScreen')
    .classList
    .remove('hidden');

  $('lineLoginButton')
    .onclick =
    startLineLogin;

}


/* ==================================================
   6. LINE Login
   ================================================== */

function startLineLogin() {

  try {

    if (
      !liff.isLoggedIn()
    ) {

      liff.login({

        redirectUri:
          window.location.href

      });

    }

  } catch (error) {

    showLoginError(
      error.message
    );

  }

}


/* ==================================================
   7. LINE 登入後
   ================================================== */

async function continueAfterLineLogin() {

  try {

    $('loadingScreen')
      .classList
      .remove('hidden');

    $('loginScreen')
      .classList
      .add('hidden');


    /*
     * ID Token
     *
     * 不直接把 LINE User ID 當作身分驗證。
     */

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        '無法取得 LINE ID Token。請確認 LIFF 已開啟 openid 權限。'
      );

    }


    /*
     * 詢問 Apps Script：
     * 這個 LINE 帳號是不是已經註冊？
     */

    const result =
      await api(
        'checkUser',
        {
          idToken:
            idToken
        }
      );


    /*
     * 已經是系統使用者
     */

    if (
      result.registered
    ) {

      currentRole =
        String(
          result.role || ''
        ).toUpperCase();


      if (
        currentRole ===
        'STUDENT'
      ) {

        currentStudent =
          result.student;

        currentUser = {

          Name:
            result.student.Name,

          Role:
            'STUDENT',

          LINE_User_ID:
            result.lineUserId

        };

      } else {

        currentUser =
          result.user;

      }


      showApp();

      return;

    }


    /*
     * 尚未註冊
     *
     * → 進入學員登入
     */

    showStudentLogin();


  } catch (error) {

    showInitError(
      error
    );

  }

}


/* ==================================================
   8. 學員登入頁
   ================================================== */

function showStudentLogin() {

  $('loadingScreen')
    .classList
    .add('hidden');

  $('loginScreen')
    .classList
    .add('hidden');

  $('appScreen')
    .classList
    .add('hidden');

  $('studentLoginScreen')
    .classList
    .remove('hidden');


  $('studentLoginButton')
    .onclick =
    loginStudent;

}


/* ==================================================
   9. 學員登入
   ================================================== */

async function loginStudent() {

  const name =
    $('studentName')
      .value
      .trim();


  const phone =
    $('studentPhone')
      .value
      .trim();


  if (!name) {

    showStudentMessage(
      '請輸入學員姓名'
    );

    return;

  }


  try {

    setButtonLoading(
      $('studentLoginButton'),
      true,
      '登入中……'
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        '無法取得 LINE ID Token'
      );

    }


    const result =
      await api(
        'loginStudent',
        {

          idToken:
            idToken,

          Name:
            name,

          Phone:
            phone

        }
      );


    /*
     * 同名
     *
     * → 顯示手機欄位
     */

    if (
      result.needPhone
    ) {

      $('phoneGroup')
        .classList
        .remove('hidden');

      showStudentMessage(
        result.message ||
        '找到多位同名學員，請輸入手機號碼確認身份',
        false
      );

      setButtonLoading(
        $('studentLoginButton'),
        false,
        '登入'
      );

      return;

    }


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        '登入失敗'
      );

    }


    /*
     * 登入成功
     */

    currentRole =
      'STUDENT';

    currentStudent =
      result.student;

    currentUser = {

      Name:
        result.student.Name,

      Role:
        'STUDENT',

      LINE_User_ID:
        result.lineUserId

    };


    $('studentLoginScreen')
      .classList
      .add('hidden');


    showApp();


  } catch (error) {

    showStudentMessage(
      error.message
    );

  } finally {

    setButtonLoading(
      $('studentLoginButton'),
      false,
      '登入'
    );

  }

}


/* ==================================================
   10. 顯示主系統
   ================================================== */

function showApp() {

  $('loadingScreen')
    .classList
    .add('hidden');

  $('loginScreen')
    .classList
    .add('hidden');

  $('studentLoginScreen')
    .classList
    .add('hidden');

  $('appScreen')
    .classList
    .remove('hidden');


  renderUserInfo();

  renderNavigation();

  showDefaultPage();

}


/* ==================================================
   11. 使用者資訊
   ================================================== */

function renderUserInfo() {

  const role =
    String(
      currentRole || ''
    ).toUpperCase();


  let name =
    '使用者';


  if (
    role === 'STUDENT' &&
    currentStudent
  ) {

    name =
      currentStudent.Name ||
      '學員';

  } else if (
    currentUser
  ) {

    name =
      currentUser.Name ||
      currentUser.UserID ||
      '使用者';

  }


  $('userName')
    .textContent =
    name;


  $('userRole')
    .textContent =
    getRoleText(
      role
    );


  /*
   * 嘗試取得 LINE 頭像
   */

  try {

    if (
      liff.getDecodedIDToken
    ) {

      const decoded =
        liff.getDecodedIDToken();


      if (
        decoded &&
        decoded.picture
      ) {

        $('userAvatar')
          .src =
          decoded.picture;

      }

    }

  } catch (error) {

    console.log(
      '無法取得頭像',
      error
    );

  }

}


/* ==================================================
   12. 角色文字
   ================================================== */

function getRoleText(
  role
) {

  switch (
    String(
      role || ''
    ).toUpperCase()
  ) {

    case 'ADMIN':
      return '管理員 / ADMIN';

    case 'TEACHER':
      return '老師 / TEACHER';

    case 'STUDENT':
      return '學員 / STUDENT';

    default:
      return role || 'USER';

  }

}


/* ==================================================
   13. 導覽
   ================================================== */

function renderNavigation() {

  const nav =
    $('navigation');


  nav.innerHTML =
    '';


  const role =
    String(
      currentRole || ''
    ).toUpperCase();


  /*
   * 所有人
   */

  addNavButton(
    nav,
    '查看課程',
    'courses'
  );


  /*
   * 所有人
   */

  addNavButton(
    nav,
    '查看簽到紀錄',
    'attendance'
  );


  /*
   * 老師 / 管理員
   */

  if (
    role === 'TEACHER' ||
    role === 'ADMIN'
  ) {

    addNavButton(
      nav,
      '課程管理',
      'courseManagement'
    );

  }


  /*
   * 管理員
   */

  if (
    role === 'ADMIN'
  ) {

    addNavButton(
      nav,
      '使用者管理',
      'userManagement'
    );

    addNavButton(
      nav,
      '系統 Logs',
      'logs'
    );

  }

}


/* ==================================================
   14. 加入 Nav
   ================================================== */

function addNavButton(
  container,
  text,
  page
) {

  const button =
    document.createElement(
      'button'
    );


  button.textContent =
    text;


  button.onclick =
    () =>
      showPage(
        page,
        button
      );


  container.appendChild(
    button
  );

}


/* ==================================================
   15. 預設頁面
   ================================================== */

function showDefaultPage() {

  showPage(
    'courses'
  );

}


/* ==================================================
   16. 顯示頁面
   ================================================== */

async function showPage(
  page,
  clickedButton
) {

  if (
    clickedButton
  ) {

    document
      .querySelectorAll(
        '#navigation button'
      )
      .forEach(
        button =>
          button.classList
            .remove(
              'active'
            )
      );


    clickedButton
      .classList
      .add(
        'active'
      );

  }


  const content =
    $('contentArea');


  content.innerHTML =
    '<div class="card loading">載入中……</div>';


  try {

    switch (
      page
    ) {

      case 'courses':
        await renderCoursesPage();
        break;

      case 'attendance':
        await renderAttendancePage();
        break;

      case 'courseManagement':
        await renderCourseManagement();
        break;

      case 'userManagement':
        await renderUserManagement();
        break;

      case 'logs':
        await renderLogs();
        break;

      default:

        content.innerHTML =
          '<div class="card">找不到頁面</div>';

    }

  } catch (error) {

    content.innerHTML =
      '<div class="card">' +
      '<div class="error-box">' +
      escapeHtml(
        error.message
      ) +
      '</div>' +
      '</div>';

  }

}


/* ==================================================
   17. 課程頁面
   ================================================== */

/* ==================================================
   18. 課程卡片
   ================================================== */

function renderCourseCard(
  course,
  role
) {

  const status =
    String(
      course.Status || ''
    ).toUpperCase();


  let statusClass =
    'status-draft';


  let statusText =
    status || '未知';


  if (
    status === 'OPEN'
  ) {

    statusClass =
      'status-open';

    statusText =
      '開放簽到';

  } else if (
    status === 'CLOSED'
  ) {

    statusClass =
      'status-closed';

    statusText =
      '已關閉';

  } else if (
    status === 'CANCELLED'
  ) {

    statusClass =
      'status-cancelled';

    statusText =
      '已取消';

  } else if (
    status === 'DRAFT'
  ) {

    statusText =
      '草稿';

  }


  let html =
    '<div class="course-card">';


  html +=
    '<span class="status ' +
    statusClass +
    '">' +
    escapeHtml(
      statusText
    ) +
    '</span>';


  html +=
    '<div class="course-name">' +
    escapeHtml(
      course.CourseName ||
      '未命名課程'
    ) +
    '</div>';


  html +=
    '<div class="course-info">';

  html +=
    '📅 ' +
    escapeHtml(
      course.CourseDate || ''
    ) +
    '<br>';

  html +=
    '⏰ ' +
    escapeHtml(
      course.StartTime || ''
    ) +
    ' - ' +
    escapeHtml(
      course.EndTime || ''
    ) +
    '<br>';

  html +=
    '👨‍🏫 ' +
    escapeHtml(
      course.TeacherName || ''
    ) +
    '<br>';

  if (
    course.Location
  ) {

    html +=
      '📍 ' +
      escapeHtml(
        course.Location
      ) +
      '<br>';

  }


  if (
    course.Description
  ) {

    html +=
      '📝 ' +
      escapeHtml(
        course.Description
      );

  }


  html +=
    '</div>';


  html +=
    '<div class="course-actions">';


  /*
   * 學員
   */

  if (
    role === 'STUDENT' &&
    status === 'OPEN'
  ) {

    html +=
      '<button class="btn btn-primary btn-small" ' +
      'onclick="checkInCourse(\'' +
      escapeJs(
        course.CourseID
      ) +
      '\')">' +
      '簽到' +
      '</button>';

  }


  /*
   * 老師 / 管理員
   */

  if (
    role === 'TEACHER' ||
    role === 'ADMIN'
  ) {

    html +=
      '<button class="btn btn-secondary btn-small" ' +
      'onclick="viewCourseAttendance(\'' +
      escapeJs(
        course.CourseID
      ) +
      '\')">' +
      '查看簽到' +
      '</button>';

  }


  html +=
    '</div>';


  html +=
    '</div>';


  return html;

}


/* ==================================================
   19. 學員簽到
   ================================================== */

async function checkInCourse(
  courseId
) {

  try {

    if (
      !confirm(
        '確定要簽到這堂課嗎？'
      )
    ) {

      return;

    }


    const result =
      await api(
        'checkIn',
        {

          idToken:
            liff.getIDToken(),

          CourseID:
            courseId

        }
      );


    if (
      result.alreadyCheckedIn
    ) {

      showTopMessage(
        '您已完成簽到。',
        'success'
      );

      return;

    }


    if (
      result.success
    ) {

      showTopMessage(
        '簽到成功！',
        'success'
      );

    } else {

      throw new Error(
        result.error ||
        '簽到失敗'
      );

    }

  } catch (error) {

    showTopMessage(
      error.message,
      'error'
    );

  }

}

        '修改角色失敗'
      );

    }


    showTopMessage(
      '使用者角色已更新',
      'success'
    );


    await renderUserManagement();


  } catch (error) {

    alert(
      error.message
    );

  }

}


/* ==================================================
   34. Logs
   ================================================== */

async function renderLogs() {

  if (
    String(
      currentRole
    ).toUpperCase() !==
    'ADMIN'
  ) {

    throw new Error(
      '只有管理員可以查看 Logs'
    );

  }


  const result =
    await api(
      'getLogs',
      {

        idToken:
          liff.getIDToken()

      }
    );


  const logs =
    result.logs || [];


  let html =
    '<div class="card">';


  html +=
    '<div class="section-title">' +
    '系統 Logs' +
    '</div>';


  if (
    logs.length === 0
  ) {

    html +=
      '<div class="empty">' +
      '目前沒有 Logs' +
      '</div>';

  } else {

    html +=
      '<div style="overflow-x:auto;">';

    html +=
      '<table>';

    html +=
      '<thead><tr>' +

      '<th>時間</th>' +
      '<th>Action</th>' +
      '<th>結果</th>' +
      '<th>CourseID</th>' +
      '<th>訊息</th>' +

      '</tr></thead>';

    html +=
      '<tbody>';


    /*
     * 最新的在前面
     */

    [...logs]
      .reverse()
      .forEach(
        log => {

          html +=
            '<tr>';

          html +=
            '<td>' +
            escapeHtml(
              log.Time || ''
            ) +
            '</td>';

          html +=
            '<td>' +
            escapeHtml(
              log.Action || ''
            ) +
            '</td>';

          html +=
            '<td>' +
            escapeHtml(
              log.Result || ''
            ) +
            '</td>';

          html +=
            '<td>' +
            escapeHtml(
              log.CourseID || ''
            ) +
            '</td>';

          html +=
            '<td>' +
            escapeHtml(
              log.Message || ''
            ) +
            '</td>';

          html +=
            '</tr>';

        }
      );


    html +=
      '</tbody>';

    html +=
      '</table>';

    html +=
      '</div>';

  }


  html +=
    '</div>';


  $('contentArea')
    .innerHTML =
    html;

}


/* ==================================================
   35. API
   ================================================== */

async function api(
  action,
  data
) {

  const payload =
    Object.assign(
      {},
      data || {},
      {
        action:
          action
      }
    );


  const response =
    await fetch(
      CONFIG.API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    throw new Error(
      '伺服器回傳的資料不是有效 JSON：\n' +
      text.substring(
        0,
        500
      )
    );

  }


  if (
    result &&
    result.success === false
  ) {

    throw new Error(
      result.error ||
      '系統操作失敗'
    );

  }


  return result;

}

function openModal() {

    .classList
    .remove(
      'hidden'
    );

}


function closeModal() {

  $('modal')
    .classList
    .add(
      'hidden'
    );

}


$('modal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target ===

      ) {

        closeModal();

      }

    }
  );

/* ==================================================
   41. Button Loading
   ================================================== */

function setButtonLoading(
  button,
  loading,
  text
) {

  if (!button) {

    return;

  }


  if (
    loading
  ) {

    button.dataset.originalText =
      button.textContent;

    button.disabled =
      true;

    button.textContent =
      text ||
      '處理中……';

  } else {

    button.disabled =
      false;

    button.textContent =
      text ||
      button.dataset.originalText ||
      '確認';

  }

}


/* ==================================================
   42. HTML Escape
   ================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==================================================
   43. JavaScript Escape
   ================================================== */

function escapeJs(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      '\\n'
    )
    .replace(
      /\r/g,
      '\\r'
    );

}


/* ==================================================
   44. Attribute Escape
   ================================================== */

function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}
